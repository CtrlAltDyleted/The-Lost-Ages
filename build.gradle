plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets {
    bootstrap {
        compileClasspath += sourceSets.main.compileClasspath
    }
}

def dependencyCatalog = new groovy.json.JsonSlurper().parse(file('src/bootstrap/resources/dependencies.json'))

repositories {
    flatDir { dirs 'Lost Ages Mods/mods' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('local:appliedenergistics2-forge:15.4.10')
    compileOnly fg.deobf('local:curios-forge:5.14.1+1.20.1')
    compileOnly fg.deobf('local:ae2insertexportcard:1.20.1-1.3.0')
    compileOnly fg.deobf('local:AppliedFlux:1.20-1.3.7-forge')
    compileOnly fg.deobf('local:jei-1.20.1-forge:15.21.0.148')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    inputs.file 'src/bootstrap/resources/dependencies.json'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    doLast {
        def metadata = new File(destinationDir, 'META-INF/mods.toml')
        metadata.append('\n' + dependencyCatalog.findAll { !it.pack }.collect { dep ->
            """[[dependencies.${mod_id}]]
modId="${dep.id}"
mandatory=true
versionRange="${dep.range}"
ordering="${dep.ordering}"
side="BOTH"
"""
        }.join('\n'), 'UTF-8')
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'gameplay'
    destinationDirectory = layout.buildDirectory.dir('internal')
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }

    from(rootProject.file('LICENSE.txt')) {
        into('META-INF')
        rename { 'LICENSE-thelostages.txt' }
    }

    from(rootProject.file('COPYRIGHT.md')) {
        into('META-INF')
    }

    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into('META-INF')
    }

    from(rootProject.file('licenses/Create-Molten-Vents-MIT.txt')) {
        into('META-INF/third_party')
    }
    from(rootProject.file('licenses/Create-Resource-Vents-MIT.txt')) {
        into('META-INF/third_party')
    }
    from(rootProject.file('licenses/AE2-Import-Export-Card-MIT.txt')) {
        into('META-INF/third_party')
    }
    from(rootProject.files('licenses/Applied-Flux-LGPL-3.0.txt', 'licenses/GPL-3.0.txt')) {
        into('META-INF/third_party')
    }

    finalizedBy 'reobfJar'
}

tasks.register('releaseJar', Jar) {
    dependsOn tasks.named('reobfJar'), tasks.named('bootstrapClasses')
    archiveClassifier = ''
    from sourceSets.bootstrap.output
    from 'src/main/resources/thelostages.png'
    from('licenses/Exo-OFL.txt') { into 'META-INF/third_party' }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from(tasks.named('jar').flatMap { it.archiveFile }) {
        into 'META-INF/thelostages'
        rename { 'gameplay.jar' }
    }
    manifest.attributes('Automatic-Module-Name': 'org.ctrlaltdyleted.thelostages.bootstrap',
            'Implementation-Version': mod_version, 'FMLModType': 'LIBRARY')
}

tasks.named('assemble') { dependsOn tasks.named('releaseJar') }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
